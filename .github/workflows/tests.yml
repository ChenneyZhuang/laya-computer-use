name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: contract (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The `requires-python` floor (3.10) must appear here; raising the floor
        # without updating the matrix is the classic silent CI break.
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-14, python: "3.12" }
          - { os: macos-15, python: "3.13" }
          - { os: windows-2022, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the decision engine (dependency)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/ChenneyZhuang/laya-browser-agent.git"

      - name: Install this package (no model extras)
        run: python -m pip install -e . pytest ruff

      - name: Contract tests (no checkpoint, no cua-driver, no live app)
        run: python -m pytest tests/ -q

      - name: Lint (correctness rules only)
        run: ruff check .

      - name: Assert no model runtime leaked into the environment
        shell: bash
        run: |
          if python -c "import laya_mlx" 2>/dev/null; then
            echo "::error::laya-mlx is installed; the contract suite must not require a checkpoint"; exit 1
          fi
          echo "no model runtime present — suite is checkpoint-free"

      - name: Assert the AX module imports without cua-driver installed
        shell: bash
        run: |
          python -c "import laya_computer_use.ax as m; print('ax ok', len(m.ROLE_MAP), 'roles')"
          python -c "from laya_computer_use import CuaDriver; print('driver ok')"

  # Live desktop work needs macOS + Accessibility permission + a real window, so it is
  # opt-in: it runs on a macOS runner only when dispatched, never on a plain push.
  macos-live-contract:
    name: macos live contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/ChenneyZhuang/laya-browser-agent.git"
          python -m pip install -e . pytest
      - name: Contract suite on macOS
        run: python -m pytest tests/ -q
      - name: Report whether cua-driver is present
        run: |
          if command -v cua-driver >/dev/null 2>&1; then
            echo "cua-driver present"
          else
            echo "cua-driver absent — live tests skipped (expected on a fresh runner)"
          fi
